<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Caja - Restaurante POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f3f4f6;color:#222}header{background:#1f2937;color:#fff;padding:18px 25px;display:flex;justify-content:space-between}main{padding:20px;display:grid;grid-template-columns:1fr 360px;gap:20px}.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px #0001}h1{font-size:22px}.titulo{font-size:20px;font-weight:bold;margin-bottom:15px}.cuentas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.cuenta{border:1px solid #ddd;border-radius:10px;padding:15px;cursor:pointer}.cuenta:hover{border-color:#2563eb}.total{font-size:25px;font-weight:bold;margin:20px 0}.metodos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metodo,.cobrar{border:0;padding:13px;border-radius:8px;cursor:pointer;font-weight:bold}.metodo{background:#e5e7eb}.metodo.activo{background:#2563eb;color:#fff}.cobrar{width:100%;background:#16a34a;color:#fff;margin-top:15px;font-size:16px}.resumen{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:8px}@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>💳 Caja / Punto de Venta</h1><span>● Sistema conectado</span></header>
<main>
<section class="panel"><div class="titulo">Cuentas abiertas</div><div id="cuentas" class="cuentas"></div></section>
<section class="panel"><div class="titulo" id="tituloCuenta">Selecciona una cuenta</div><div id="detalle">No hay cuenta seleccionada.</div><div class="total" id="total">$0.00</div><div class="titulo">Método de pago</div><div class="metodos"><button class="metodo activo" onclick="metodoPago('Efectivo',this)">💵 Efectivo</button><button class="metodo" onclick="metodoPago('Tarjeta',this)">💳 Tarjeta</button><button class="metodo" onclick="metodoPago('Transferencia',this)">📱 Transferencia</button><button class="metodo" onclick="metodoPago('Mixto',this)">🔄 Mixto</button></div><div id="efectivo"><label>Recibido</label><input id="recibido" type="number" min="0" oninput="cambio()"><div class="resumen"><span>Cambio</span><strong id="cambio">$0.00</strong></div></div><button class="cobrar" onclick="cobrar()">Cobrar cuenta</button></section>
</main>
<script>
let cuentas=[{id:1,mesa:3,total:340,items:[["Hamburguesa Especial",2],["Coca-Cola",2]]},{id:2,mesa:6,total:295,items:[["Tacos al Pastor",3],["Agua Natural",1]]},{id:3,mesa:8,total:195,items:[["Hamburguesa Clásica",1],["Cheesecake",1]]}],seleccionada=null,pago='Efectivo';
function render(){document.getElementById('cuentas').innerHTML=cuentas.map(c=>`<div class="cuenta" onclick="seleccionar(${c.id})"><strong>Mesa ${c.mesa}</strong><br><br>${c.items.map(i=>i[1]+' × '+i[0]).join('<br>')}<br><br><strong>$${c.total.toFixed(2)}</strong></div>`).join('')}
function seleccionar(id){seleccionada=cuentas.find(c=>c.id===id);document.getElementById('tituloCuenta').textContent='Cuenta Mesa '+seleccionada.mesa;document.getElementById('detalle').innerHTML=seleccionada.items.map(i=>`<div class="resumen"><span>${i[1]} × ${i[0]}</span></div>`).join('');document.getElementById('total').textContent='$'+seleccionada.total.toFixed(2);cambio();}
function metodoPago(m,b){pago=m;document.querySelectorAll('.metodo').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');document.getElementById('efectivo').style.display=m==='Efectivo'?'block':'none';}
function cambio(){if(!seleccionada)return;let r=Number(document.getElementById('recibido').value)||0;document.getElementById('cambio').textContent='$'+Math.max(0,r-seleccionada.total).toFixed(2)}
function cobrar(){if(!seleccionada)return alert('Selecciona una cuenta.');if(pago==='Efectivo'&&(Number(document.getElementById('recibido').value)||0)<seleccionada.total)return alert('El efectivo recibido es insuficiente.');alert('Pago registrado correctamente.');cuentas=cuentas.filter(c=>c.id!==seleccionada.id);seleccionada=null;document.getElementById('tituloCuenta').textContent='Selecciona una cuenta';document.getElementById('detalle').textContent='No hay cuenta seleccionada.';document.getElementById('total').textContent='$0.00';document.getElementById('recibido').value='';render();}
render();
</script>
</body>
</html>
