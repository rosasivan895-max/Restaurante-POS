<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina - Restaurante POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#1f2937;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px}.estado{color:#86efac;font-size:14px}main{padding:20px}.barra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filtro{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:bold;background:#e5e7eb}.filtro.activo{background:#2563eb;color:#fff}
.pedidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.pedido{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001;border-left:7px solid #f97316}.pedido.preparando{border-left-color:#2563eb}.pedido.listo{border-left-color:#16a34a}
.cabecera{display:flex;justify-content:space-between;margin-bottom:14px}.mesa{font-size:20px;font-weight:bold}.hora{color:#6b7280;font-size:13px}ul{list-style:none;margin:12px 0}.item{padding:8px 0;border-bottom:1px solid #eee}.estado-pedido{font-weight:bold;margin:12px 0;color:#f97316}.pedido.preparando .estado-pedido{color:#2563eb}.pedido.listo .estado-pedido{color:#16a34a}
button.accion{width:100%;padding:12px;border:0;border-radius:8px;color:#fff;background:#f97316;font-weight:bold;cursor:pointer}.pedido.preparando button.accion{background:#2563eb}.pedido.listo button.accion{background:#16a34a}.vacio{text-align:center;color:#777;padding:60px}
</style>
</head>
<body>
<header><h1>👨‍🍳 Cocina</h1><span class="estado">● Sistema conectado</span></header>
<main>
<div class="barra">
<button class="filtro activo" onclick="filtrar('todos',this)">Todos</button>
<button class="filtro" onclick="filtrar('nuevo',this)">Nuevos</button>
<button class="filtro" onclick="filtrar('preparando',this)">Preparando</button>
<button class="filtro" onclick="filtrar('listo',this)">Listos</button>
</div>
<div id="pedidos" class="pedidos"></div>
</main>
<script>
let pedidos=[
{id:1001,mesa:3,hora:"20:32",estado:"nuevo",items:[["Hamburguesa Especial",2],["Coca-Cola",2]]},
{id:1002,mesa:6,hora:"20:35",estado:"preparando",items:[["Tacos al Pastor",3],["Agua Natural",1]]},
{id:1003,mesa:8,hora:"20:39",estado:"listo",items:[["Hamburguesa Clásica",1],["Cheesecake",1]]}
];
let filtro="todos";
function filtrar(f,b){filtro=f;document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');render();}
function siguiente(id){const p=pedidos.find(x=>x.id===id);if(!p)return;if(p.estado==='nuevo')p.estado='preparando';else if(p.estado==='preparando')p.estado='listo';else if(p.estado==='listo')p.estado='entregado';render();}
function render(){const cont=document.getElementById('pedidos');const lista=pedidos.filter(p=>(filtro==='todos'&&p.estado!=='entregado')||p.estado===filtro);if(!lista.length){cont.innerHTML='<div class="vacio">No hay pedidos en este estado.</div>';return}cont.innerHTML=lista.map(p=>`<article class="pedido ${p.estado}"><div class="cabecera"><span class="mesa">Mesa ${p.mesa}</span><span class="hora">${p.hora}</span></div><div class="estado-pedido">${p.estado.toUpperCase()}</div><ul>${p.items.map(i=>`<li class="item"><strong>${i[1]} ×</strong> ${i[0]}</li>`).join('')}</ul><button class="accion" onclick="siguiente(${p.id})">${p.estado==='nuevo'?'🔥 Comenzar preparación':p.estado==='preparando'?'✅ Marcar como listo':'🍽️ Marcar entregado'}</button></article>`).join('');}
render();
</script>
</body>
</html>
