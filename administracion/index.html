<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administración - Restaurante POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f3f4f6;color:#222}header{background:#1f2937;color:#fff;padding:18px 25px}.wrap{padding:20px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.kpi{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}.kpi small{color:#6b7280}.kpi strong{display:block;font-size:26px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px #0001}.titulo{font-size:19px;font-weight:bold;margin-bottom:15px}.producto{display:grid;grid-template-columns:1fr 100px 80px;gap:10px;padding:12px 0;border-bottom:1px solid #eee}input{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px}.btn{border:0;border-radius:7px;padding:9px;cursor:pointer;font-weight:bold;background:#2563eb;color:#fff}.agregar{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin-bottom:15px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:500px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>⚙️ Administración</h1><p>Control del Restaurante POS</p></header>
<div class="wrap"><div class="kpis"><div class="kpi"><small>Ventas del día</small><strong>$8,450</strong></div><div class="kpi"><small>Pedidos</small><strong>47</strong></div><div class="kpi"><small>Ticket promedio</small><strong>$179.79</strong></div><div class="kpi"><small>Mesas ocupadas</small><strong>6 / 10</strong></div></div>
<div class="grid"><section class="panel"><div class="titulo">🍔 Productos</div><div class="agregar"><input id="nombre" placeholder="Nombre"><input id="precio" type="number" placeholder="Precio"><button class="btn" onclick="agregar()">Agregar</button></div><div id="lista"></div></section>
<section class="panel"><div class="titulo">📊 Resumen de ventas</div><table><thead><tr><th>Categoría</th><th>Ventas</th></tr></thead><tbody><tr><td>Hamburguesas</td><td>$3,420</td></tr><tr><td>Tacos</td><td>$2,180</td></tr><tr><td>Bebidas</td><td>$1,650</td></tr><tr><td>Postres</td><td>$1,200</td></tr></tbody></table><br><div class="titulo">👥 Usuarios</div><p>Administrador · Caja · Meseros · Cocina</p></section></div></div>
<script>
let productos=[["Hamburguesa Clásica",120],["Hamburguesa Especial",150],["Hamburguesa Doble",180],["Tacos al Pastor",90],["Tacos de Bistec",100],["Coca-Cola",35],["Agua Natural",25],["Pastel de Chocolate",70],["Cheesecake",75]];
function render(){document.getElementById('lista').innerHTML=productos.map((p,i)=>`<div class="producto"><span>${p[0]}</span><input type="number" value="${p[1]}" onchange="productos[${i}][1]=Number(this.value)"><button class="btn" onclick="eliminar(${i})">Eliminar</button></div>`).join('')}
function agregar(){let n=document.getElementById('nombre').value.trim(),p=Number(document.getElementById('precio').value);if(!n||!p)return alert('Captura nombre y precio.');productos.push([n,p]);document.getElementById('nombre').value='';document.getElementById('precio').value='';render()}
function eliminar(i){if(confirm('¿Eliminar producto?')){productos.splice(i,1);render()}}
render();
</script>
</body>
</html>
